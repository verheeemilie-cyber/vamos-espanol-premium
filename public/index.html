// Premium codes are validated only by the Netlify backend. No real codes or secrets are shipped here.
const ACTIVATION_KEY='vamos_premium_server_token_v6';
const DEVICE_KEY='vamos_premium_device_v6';
const API_URL='/api/premium';
function localGet(key){try{return localStorage.getItem(key)||'';}catch(e){return '';}}
function localSet(key,val){try{localStorage.setItem(key,val);}catch(e){}}
function localRemove(key){try{localStorage.removeItem(key);}catch(e){}}
function deviceID(){
 let id=localGet(DEVICE_KEY);
 if(!/^[a-f0-9-]{36}$/.test(id)){
  if(window.crypto?.randomUUID){id=crypto.randomUUID();}
  else{const b=new Uint8Array(16);crypto.getRandomValues(b);const hex=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');id=hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);}
  localSet(DEVICE_KEY,id);
 }
 return id;
}

function activationStatus(key,cls='error'){

async function apiPremium(payload){
 const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});
 let data={};try{data=await res.json();}catch(e){}
 if(!res.ok||!data.ok){const err=new Error(data.error||'offline');err.status=res.status;throw err;}
 return data;
}
function applyPremiumPayload(data){
 if(!Array.isArray(data.lessons)||data.lessons.length!==25||!Array.isArray(data.dialogues)||data.dialogues.length!==25){throw new Error('invalid_payload');}
 data.lessons.forEach((lesson,i)=>{
  if(!lesson||!Array.isArray(lesson.pairs)||lesson.pairs.length<10)throw new Error('invalid_payload');
  lessons[10+i]=lesson;
 });
 data.dialogues.forEach((dialogue,i)=>{
  if(!Array.isArray(dialogue)||dialogue.length<5)throw new Error('invalid_payload');
  sceneDialogues[10+i]=dialogue;
 });
 estPremium=true;window.estPremium=true;
 document.body.dataset.premium='true';
 localSet(ACTIVATION_KEY,data.token);
 render();refreshActivationCopy();
}
function deactivatePremium(){
 estPremium=false;window.estPremium=false;document.body.dataset.premium='false';
 localRemove(ACTIVATION_KEY);
 for(let i=10;i<lessons.length;i++){lessons[i]={...lessons[i],pairs:[]};sceneDialogues[i]=[];}
 if(current>=FREE_COUNT)backToLessons();else render();
}
async function activatePremium(){
 const entered=$('premiumCode').value.trim().toUpperCase().replace(/\s+/g,'');
 if(!/^PACO(?:-[A-Z2-9]{5}){4}$/.test(entered)){activationStatus('wrong');return;}
 $('redeemPremium').disabled=true;activationStatus('loading','');
 try{

function discoverSpanishVoices(){
 if(!('speechSynthesis' in window))return [];
 spanishVoices=window.speechSynthesis.getVoices().filter(v=>/^es([_-]|$)/i.test(v.lang));
 return spanishVoices;
}
if('speechSynthesis' in window){discoverSpanishVoices();window.speechSynthesis.onvoiceschanged=()=>{discoverSpanishVoices();refreshVoiceStudio();};}
function pickVoice(gender){
 const voices=discoverSpanishVoices();
 if(!voices.length)return null;
 const chosen=localStorage.getItem('vamos_voice_'+gender);if(chosen){const match=voices.find(v=>v.voiceURI===chosen);if(match)return match;}
 const female=/paulina|sabina|monica|mónica|lucia|lucía|helena|elena|sofia|sofía|paloma|maria|maría|female|woman|mujer|dalia|isabella|valentina|camila|ximena/i;
 const male=/jorge|diego|pablo|carlos|raul|raúl|male|man|hombre|alvaro|álvaro|andrés|andres|mateo|enrique|nicolas|nicolás/i;
 const rank=v=>(/natural|neural|premium|google|microsoft/i.test(v.name)?5:0)+(/es[-_]CR/i.test(v.lang)?6:/es[-_](MX|CO|US|AR|PE)/i.test(v.lang)?4:1);
 const sorted=[...voices].sort((a,b)=>rank(b)-rank(a));
 const preferred=sorted.filter(v=>(gender==='f'?female:male).test(v.name));
 if(preferred.length)return preferred[0];
 if(sorted.length>1)return gender==='f'?sorted[0]:sorted[1];
 return sorted[0];
}
function refreshVoiceStudio(){
 const copy=vc();if(!document.getElementById('voiceStudio'))return;
 $('voiceStudioTitle').textContent=copy.title;$('femaleLabel').textContent=copy.female;$('maleLabel').textContent=copy.male;
 $('testFemale').textContent=$('testMale').textContent=copy.test;
 const voices=discoverSpanishVoices();$('voiceStudioStatus').textContent=voices.length===0?copy.none:voices.length===1?copy.one:copy.many;
 for(const [gender,id] of [['f','femaleVoice'],['m','maleVoice']]){
  const sel=$(id),old=sel.value;sel.replaceChildren();
  if(!voices.length){const option=document.createElement('option');option.textContent='—';sel.append(option);sel.disabled=true;continue;}
  sel.disabled=false;
  voices.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' · '+v.lang;sel.append(o);});
  const selected=localStorage.getItem('vamos_voice_'+gender)||old;
  const preferred=voices.find(v=>v.voiceURI===selected)||pickVoice(gender)||voices[0];sel.value=preferred.voiceURI;
 }
}

function speak(value,rate=1,gender=null){
 if(activeAudio){activeAudio.pause();activeAudio=null;}
 if('speechSynthesis' in window)window.speechSynthesis.cancel();
 // Dialogue lines request two distinct browser voices when available.
 if(gender&&pickVoice(gender)){fallbackSpeech(value,rate,gender);return;}
 const file=recordedAudio[value];
 if(file){const a=new Audio('audio/'+file);a.playbackRate=rate;activeAudio=a;a.play().catch(()=>fallbackSpeech(value,rate,gender));return;}
 fallbackSpeech(value,rate,gender);
}
function fallbackSpeech(value,rate=1,gender=null){
 if(!('speechSynthesis' in window)){alert(t('audioError'));return;}
 window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(value);
 u.lang='es-CR';u.rate=.93*rate;u.pitch=gender==='f'?1.08:0.95;
 const voice=pickVoice(gender||'f');if(voice){u.voice=voice;u.lang=voice.lang;}
 window.speechSynthesis.speak(u);
}

function distractors(correct){
 const local=lessonPool().map(p=>p.es).filter(x=>x!==correct);
 const wc=x=>x.trim().split(/\s+/).length;
 local.sort((a,b)=>Math.abs(wc(a)-wc(correct))-Math.abs(wc(b)-wc(correct))||a.localeCompare(b,'es'));
 const opts=[correct];for(const x of local){if(!opts.includes(x))opts.push(x);if(opts.length===4)break;}
 if(opts.length<4){for(const l of lessons){if(l.premium&&!estPremium)continue;for(const p of l.pairs){if(!opts.includes(p.es))opts.push(p.es);if(opts.length===4)break;}if(opts.length===4)break;}}

}

function lessonPool(){return [...lessons[current].pairs,...sceneDialogues[current]];}
function sceneBubble(p){
 const wrap=document.createElement('div');wrap.className='dialogueBubble'+(p.speaker==='m'?' male':'');
 const avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=p.speaker==='m'?'👨🏽':'👩🏽';
 const b=document.createElement('button');b.type='button';b.textContent='🔊 '+p.es;b.setAttribute('aria-label',dc().tap+' '+p.es);b.onclick=()=>speak(p.es,1,p.speaker);
 wrap.append(avatar,b);return wrap;
}
function renderScene(j){
 const scene=$('dialogueScene');scene.replaceChildren();scene.classList.remove('hidden');
 const header=document.createElement('div');header.className='sceneTitle';header.textContent=dc().scene+' · '+title(lessons[current]);scene.append(header);
 if(j===0){const p=document.createElement('div');p.className='dialogueHint';p.textContent=dc().situation+' : '+title(lessons[current]);scene.append(p);}
 for(let k=Math.max(0,j-2);k<j;k++)scene.append(sceneBubble(sceneDialogues[current][k]));
 const help=document.createElement('div');help.className='dialogueHint';help.textContent=dc().tap;scene.append(help);
}

function setQuestionHeader(type){
 const phase=Math.min(2,Math.floor(index/5));
 $('meta').textContent=t('mission')+' '+(current+1)+' · '+t('question')+' '+(index+1)+'/'+CHALLENGES_PER_MISSION+' · ❤️ '+hearts+' · 🔥 '+streak;
 $('missionTrackBar').style.width=((index+1)/CHALLENGES_PER_MISSION*100)+'%';
 $('challengeStage').textContent=cc().phase[phase]+' · '+type;
}
function soundControls(es,showHelp=false,gender=null){
 const row=document.createElement('div');row.className='soundRow';
 const normal=document.createElement('button');normal.type='button';normal.className='speech';normal.textContent=cc().play;normal.onclick=()=>speak(es,1,gender);
 const slow=document.createElement('button');slow.type='button';slow.className='speech';slow.textContent=cc().slow;slow.onclick=()=>speak(es,.72,gender);
 row.append(normal,slow);$('answers').append(row);
 if(showHelp){const p=document.createElement('p');p.className='challengeHelp';p.textContent=cc().needSound;$('answers').append(p);}
}
function translatedChoices(lesson,correct){
 const list=[correct];for(let step=1;step<=9&&list.length<4;step++){
  const x=phrase(lesson.pairs[(index+step*3)%10]);if(!list.includes(x))list.push(x);
 }
 return shuffleItems(list);
}
function shuffleItems(items){
 const a=[...items];let seed=(current+1)*199+(index+1)*61;
 for(let i=a.length-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]];}
 return a;
}
function question(){
 if(!lessons[current]||(lessons[current].premium&&(!estPremium||!lessons[current].pairs?.length))){backToLessons();return;}
 locked=false;selected=[];questionMistakes=0;
 const lesson=lessons[current],p=lessonPair(),translated=phrase(p),es=p.es;
 $('lessonTip').textContent=note(lesson)?t('notePrefix')+note(lesson):'';
 $('lessonTip').classList.toggle('hidden',!note(lesson));
 $('feedback').textContent='';$('feedback').className='';$('next').classList.add('hidden');$('answers').replaceChildren();
 $('next').textContent=t('continue');$('next').onclick=advance;
 $('dialogueScene').classList.add('hidden');
 const mode=index;
 if(mode>=5&&mode<=9){dialogueQuestion(mode-5,p);return;}
 if(mode===0){setQuestionHeader(cc().types.choice);$('prompt').textContent=t('translate')+' « '+translated+' »';choices(distractors(es),es);soundControls(es);}
 else if(mode===1){setQuestionHeader(cc().types.listenChoice);$('prompt').textContent=cc().types.listenChoice;soundControls(es,true);choices(translatedChoices(lesson,translated),translated);}
 else if(mode===2){
  setQuestionHeader(cc().types.cloze);
  if(es.trim().split(/\s+/).length<2){$('prompt').textContent=cc().types.write+' « '+translated+' »';typingQuestion(es);}
  else{const parts=es.split(/\s+/);const missing=parts.pop();$('prompt').textContent=cc().types.cloze+' · '+translated;const hint=document.createElement('div');hint.className='selected';hint.textContent=parts.join(' ')+' _____';$('answers').append(hint);clozeQuestion(missing);}
 }
 else if(mode===3){setQuestionHeader(cc().types.order);$('prompt').textContent=cc().types.order+' · « '+translated+' »';if(es.split(/\s+/).length>=2)wordOrder(es);else typingQuestion(es);}
 else if(mode===4){setQuestionHeader(cc().types.write);$('prompt').textContent=cc().types.write+' · « '+translated+' »';typingQuestion(es);}
 else if(mode===5){setQuestionHeader(cc().types.dictation);$('prompt').textContent=cc().types.dictation;soundControls(es,true);typingQuestion(es);}
 else if(mode===6){setQuestionHeader(cc().types.context);$('prompt').textContent=cc().types.context+' « '+translated+' »';typingQuestion(es);}
 else if(mode===7){setQuestionHeader(cc().types.match);$('prompt').textContent=cc().types.match;matchPairs(lesson);}
 else if(mode===8){setQuestionHeader(cc().types.meaning);$('prompt').textContent=cc().types.meaning+' · « '+translated+' »';choices(distractors(es),es);}
 else if(mode===9){setQuestionHeader(cc().types.listenMeaning);$('prompt').textContent=cc().types.listenMeaning;soundControls(es,true);choices(translatedChoices(lesson,translated),translated);}
 else if(mode===10){setQuestionHeader(cc().types.boss);$('prompt').textContent=cc().types.dictation;soundControls(es,true);typingQuestion(es);}
 else if(mode===11){setQuestionHeader(cc().types.boss);$('prompt').textContent=cc().types.write+' · « '+translated+' »';typingQuestion(es);}
 else if(mode===12){setQuestionHeader(cc().types.boss);$('prompt').textContent=cc().types.order+' · « '+translated+' »';if(es.split(/\s+/).length>=2)wordOrder(es);else typingQuestion(es);}
 else if(mode===13){setQuestionHeader(cc().types.boss);const words=es.split(/\s+/);if(words.length>=2){const missing=words.pop();$('prompt').textContent=cc().types.missing+' · « '+translated+' »';const hint=document.createElement('div');hint.className='selected';hint.textContent=words.join(' ')+' _____';$('answers').append(hint);clozeQuestion(missing);}else{$('prompt').textContent=cc().types.write+' · « '+translated+' »';typingQuestion(es);}}
 else{setQuestionHeader(cc().types.boss);$('prompt').textContent=cc().types.write+' · « '+translated+' »';typingQuestion(es);}
}
function dialogueQuestion(j,p){
 const es=p.es,translated=phrase(p);
 renderScene(j);
 const gender=p.speaker;
 if(j===0){
  setQuestionHeader(dc().chooseReply);$('prompt').textContent=dc().yourTurn+' · « '+translated+' »';
  choices(distractors(es),es);soundControls(es,false,gender);
 }else if(j===1){
  setQuestionHeader(dc().chooseReply);$('prompt').textContent=dc().chooseReply+' · « '+translated+' »';
  choices(distractors(es),es);
 }else if(j===2){
  setQuestionHeader(dc().listenReply);$('prompt').textContent=dc().listenReply;
  soundControls(es,true,gender);
  const options=[translated];for(const pair of lessonPool()){const txt=phrase(pair);if(!options.includes(txt))options.push(txt);if(options.length>=4)break;}
  choices(shuffleItems(options),translated);
 }else if(j===3){
  setQuestionHeader(dc().rebuild);$('prompt').textContent=dc().rebuild+' · « '+translated+' »';
  if(es.trim().split(/\s+/).length>1)wordOrder(es);else typingQuestion(es);
 }else{
  setQuestionHeader(dc().writeReply);$('prompt').textContent=dc().writeReply+' · « '+translated+' »';
  typingQuestion(es);
 }
}

function choices(opts,answer){
 opts.forEach(txt=>{const b=document.createElement('button');b.className='answer';b.textContent=txt;b.onclick=()=>evaluate(txt===answer,b,answer);$('answers').append(b);});
}
function wordOrder(answer){
 const tokens=answer.split(/\s+/);const shuffled=shuffleItems(tokens.map((txt,i)=>({txt,i})));
 if(shuffled.length>1&&shuffled.every((v,i)=>v.i===i))shuffled.reverse();
 const display=document.createElement('div');display.className='selected';display.textContent=t('chooseWords');$('answers').append(display);
 const row=document.createElement('div');row.className='wordRow';$('answers').append(row);
 const buttons=[];
 shuffled.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='word';b.textContent=o.txt;
  b.onclick=()=>{if(locked)return;selected.push(o.txt);b.disabled=true;display.textContent=selected.join(' ');
   if(selected.length===tokens.length){const ok=normalizeAnswer(selected.join(' '))===normalizeAnswer(answer);evaluate(ok,display,answer);if(!ok&&!locked){selected=[];display.textContent=t('chooseWords');buttons.forEach(x=>x.disabled=false);}}};row.append(b);buttons.push(b);
 });
 const reset=document.createElement('button');reset.type='button';reset.className='speech';reset.textContent=t('retryPhrase');reset.onclick=()=>{if(locked)return;selected=[];display.textContent=t('chooseWords');buttons.forEach(x=>x.disabled=false);};$('answers').append(reset);
}
function matchPairs(lesson){
 const pairs=[];
 for(let n=0;n<10&&pairs.length<4;n++){
  const p=lesson.pairs[(index+n)%10];const src=phrase(p),es=p.es;
  if(!pairs.some(x=>x.src===src||x.es===es))pairs.push({src,es,id:n});
 }
 if(pairs.length<2){typingQuestion(lessonPair().es);return;}
 const grid=document.createElement('div');grid.className='matchGrid';
 const left=document.createElement('div');left.className='matchCol';const right=document.createElement('div');right.className='matchCol';grid.append(left,right);$('answers').append(grid);
 const progress=document.createElement('p');progress.className='challengeHelp';progress.textContent=cc().pairs+': 0/'+pairs.length;$('answers').append(progress);
 let leftSelected=null,rightSelected=null,matched=0;
 function select(btn,side,pair){
  if(locked||btn.disabled)return;
  if(side==='left'){if(leftSelected)leftSelected.btn.classList.remove('active');leftSelected={btn,pair};}
  else{if(rightSelected)rightSelected.btn.classList.remove('active');rightSelected={btn,pair};}
  btn.classList.add('active');
  if(!leftSelected||!rightSelected)return;
  const l=leftSelected,r=rightSelected;leftSelected=null;rightSelected=null;
  l.btn.classList.remove('active');r.btn.classList.remove('active');
  if(l.pair.id===r.pair.id){l.btn.disabled=true;r.btn.disabled=true;l.btn.classList.add('matched');r.btn.classList.add('matched');matched++;progress.textContent=cc().pairs+': '+matched+'/'+pairs.length;
   if(matched===pairs.length)evaluate(true,progress,lessonPair().es);
  }else{l.btn.classList.add('bad');r.btn.classList.add('bad');setTimeout(()=>{l.btn.classList.remove('bad');r.btn.classList.remove('bad');},450);evaluate(false,progress,lessonPair().es);}
 }
 shuffleItems(pairs).forEach(pair=>{const b=document.createElement('button');b.type='button';b.textContent=pair.src;b.onclick=()=>select(b,'left',pair);left.append(b);});
 shuffleItems([...pairs].reverse()).forEach(pair=>{const b=document.createElement('button');b.type='button';b.textContent=pair.es;b.onclick=()=>select(b,'right',pair);right.append(b);});
}
function normalizeAnswer(value){return value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¡!¿?.,]/g,'').trim().replace(/\s+/g,' ').toLowerCase();}
function typingQuestion(answer){
 const form=document.createElement('form');form.className='typingForm';
 const input=document.createElement('input');input.type='text';input.autocomplete='off';input.autocapitalize='off';input.spellcheck=false;input.placeholder=cc().types.write;input.required=true;
 const btn=document.createElement('button');btn.type='submit';btn.textContent=cc().check;
 form.append(input,btn);form.onsubmit=e=>{e.preventDefault();if(locked)return;const ok=normalizeAnswer(input.value)===normalizeAnswer(answer);evaluate(ok,btn,answer);if(ok||locked){input.disabled=true;btn.disabled=true;}else{input.focus();input.select();}};$('answers').append(form);
}
function clozeQuestion(missing){
 const form=document.createElement('form');form.className='typingForm';
 const input=document.createElement('input');input.type='text';input.autocomplete='off';input.autocapitalize='off';input.spellcheck=false;input.placeholder=cc().types.missing;input.required=true;
 const btn=document.createElement('button');btn.type='submit';btn.textContent=cc().check;
 form.append(input,btn);form.onsubmit=e=>{e.preventDefault();if(locked)return;const ok=normalizeAnswer(input.value)===normalizeAnswer(missing);evaluate(ok,btn,missing);if(ok||locked){input.disabled=true;btn.disabled=true;}else{input.focus();input.select();}};$('answers').append(form);
}
function evaluate(ok,button,answer){
 if(locked)return;
 if(ok){
  locked=true;streak++;button.classList.add('good');$('feedback').className='feedbackGood';$('feedback').textContent='✅ '+cc().perfect+' '+answer;
  addQuestionXP(questionMistakes===0?10:5);
  [...$('answers').querySelectorAll('button')].forEach(b=>b.disabled=true);$('next').classList.remove('hidden');
 }else{
  questionMistakes++;
  if(questionMistakes===1){
   $('feedback').className='feedbackTry';$('feedback').textContent='💡 '+cc().retry;
   if(button.classList?.contains('answer')){button.disabled=true;button.classList.add('bad');}
   return;
  }
  locked=true;streak=0;hearts=Math.max(0,hearts-1);
  $('feedback').className='feedbackBad';$('feedback').textContent='❌ '+cc().wrong+' '+answer+' · ❤️ '+hearts;
  [...$('answers').querySelectorAll('button')].forEach(b=>b.disabled=true);$('next').classList.remove('hidden');
  if(hearts<=0){$('feedback').textContent=t('outHearts')+' '+cc().wrong+' '+answer;$('next').textContent=t('retry');$('next').onclick=()=>start(current);}
 }
}
function advance(){
 if(lessons[current]?.premium&&!estPremium){backToLessons();return;}
 index++;
 if(index>=CHALLENGES_PER_MISSION){
  const first=!state.done[current];state.done[current]=true;save();render();
  envoyerProgression();$('quiz').classList.add('hidden');$('lessonsArea').classList.remove('hidden');
  alert(t('completed')+' '+cc().completion+' '+(first?cc().earn:cc().replay));$('lessonsArea').scrollIntoView({behavior:'smooth'});
 }else question();
}
function backToLessons(){current=-1;$('quiz').classList.add('hidden');$('lessonsArea').classList.remove('hidden');render();$('lessonsArea').scrollIntoView({behavior:'smooth'});}
$('backToLessons').onclick=backToLessons;$('next').onclick=advance;
document.querySelectorAll('[data-lang]').forEach(button=>{button.onclick=()=>setLanguage(button.dataset.lang);});
// The previous Wix Premium message bridge has been disabled to prevent bypassing server validation.
window.addEventListener('message',event=>{
 if(event.source!==window.parent||event.origin!==window.location.origin)return;
 const message=event.data;
 if(message?.type==='VAMOS_PROGRESSION'&&message.progression){
  const p=message.progression;if((p.langueInterface||'fr')!==lang)return;
  state.done=p.done&&typeof p.done==='object'?p.done:{};state.xp=Number(p.xp)||0;state.rewarded=p.rewarded||{};
  save();render();
 }
});
function envoyerProgression(){
 if(window.parent===window)return;
 window.parent.postMessage({type:'VAMOS_SAVE',progression:{done:state.done,xp:state.xp,rewarded:state.rewarded,missionsReussies:finished(),missionActuelle:Math.min(lessons.length,finished()+1),niveau:'A1',langueInterface:lang}},'*');
}
$('premiumCodeForm').addEventListener('submit',event=>{event.preventDefault();activatePremium();});
setLanguage(lang);
restorePremium();
if(window.parent!==window){
 window.parent.postMessage({type:'VAMOS_READY'},'*');
 let essaisPremium=0;
 const attentePremium=setInterval(()=>{
  if(typeof window.estPremium==='boolean'||essaisPremium>=10){clearInterval(attentePremium);return;}
  window.parent.postMessage({type:'VAMOS_READY'},'*');essaisPremium++;
 },1500);
}
</script><script>if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn)); }</script></body></html>
